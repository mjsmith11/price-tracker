{% extends "base.html" %}
{% block title %}Item · Price Tracker{% endblock %}
{% block content %}
  <a href="/">&larr; Back to dashboard</a>
  <div id="item-header">Loading…</div>

  <section>
    <h2>Edit item</h2>
    <form id="edit-item-form">
      <input type="text" id="edit-item-name" placeholder="Item name" required>
      <input type="number" id="edit-item-threshold" placeholder="Alert threshold ($)" step="0.01">
      <button type="submit">Save</button>
      <button type="button" id="delete-item-button" class="link">Delete item</button>
    </form>
  </section>

  <section>
    <canvas id="price-chart" height="100"></canvas>
  </section>

  <section>
    <h2>Listings</h2>
    <div id="listings-list"></div>

    <h3>Add a listing</h3>
    <form id="add-listing-form">
      <input type="text" id="add-listing-query" placeholder="Search query" required>
      <button type="submit">Search stores</button>
    </form>
    <div id="add-listing-results"></div>
  </section>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@3/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
<script>document.addEventListener("DOMContentLoaded", () => initItemDetail({{ item_id }}));</script>
{% endblock %}
