services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "worker.py"]
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
